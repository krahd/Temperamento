[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "temperamento"
version = "0.5.0a1"
description = "Deterministic MusicXML front end and reference interpreter for the Temperamento harmonic programming language"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Tomas Laurenzo"}]
keywords = ["programming languages", "musicxml", "esolang", "compiler", "computer music"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Compilers",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.optional-dependencies]
test = ["coverage[toml]==7.15.2", "pytest==9.1.1"]
showcase = ["Pillow==12.2.0", "reportlab==4.4.9"]
dev = [
  "build==1.3.0",
  "coverage[toml]==7.15.2",
  "mypy==2.3.0",
  "Pillow==12.2.0",
  "pytest==9.1.1",
  "reportlab==4.4.9",
  "ruff==0.15.22",
]

[project.urls]
Repository = "https://github.com/krahd/Temperamento"
Issues = "https://github.com/krahd/Temperamento/issues"
Documentation = "https://github.com/krahd/Temperamento/tree/main/docs"

[project.scripts]
temperamento = "temperamento.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["temperamento"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["temperamento"]
mypy_path = "src"
