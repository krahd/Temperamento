name: render-example-scores

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-example-scores
  cancel-in-progress: true

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      QT_QPA_PLATFORM: "xcb"
      TEMPERAMENTO_MUSESCORE: ${{ github.workspace }}/MuseScore.AppImage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Install media and headless-rendering tools
        run: |
          sudo apt-get update
          pipewire_package=libpipewire-0.3-0t64
          if ! apt-cache show "$pipewire_package" >/dev/null 2>&1; then
            pipewire_package=libpipewire-0.3-0
          fi
          sudo apt-get install -y \
            ffmpeg \
            xvfb \
            libegl1 \
            libgl1 \
            libopengl0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            "$pipewire_package"
      - name: Start virtual display
        run: |
          Xvfb :99 -screen 0 1920x1080x24 >/tmp/temperamento-xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Install checksum-pinned MuseScore Studio 4.7.4 AppImage
        run: |
          curl --fail --location \
            https://cdn.jsdelivr.net/musescore/v4.7.4/MuseScore-Studio-4.7.4.260706075-x86_64.AppImage \
            --output MuseScore.AppImage
          echo "9233ed1b87d3e6b45722278f3c286dcd41e83da778bd0f80a1dd04949696ad93  MuseScore.AppImage" | sha256sum --check --strict
          chmod +x MuseScore.AppImage
      - name: Regenerate and verify semantic artefacts
        run: make verify
      - name: Render every MusicXML example
        run: |
          temperamento doctor
          MUSESCORE_FORMATS=mscz,pdf,mp3 make render-examples
      - name: Commit complete example packages
        run: |
          rm MuseScore.AppImage
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples docs/assets spec/opcode-table.json _site
          changed=0
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate complete examples and rendered media [musescore-rendered]"
            changed=1
          fi
          make reproducibility
          if [ "$changed" -eq 1 ]; then
            git push origin HEAD:main
          fi
