name: Agent format repair branch

on:
  push:
    branches: [agent/fix-ci-audit]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ci-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.15.22
      - name: Format repair files
        run: |
          python -m ruff format \
            src/temperamento/cli.py \
            src/temperamento/project.py \
            src/temperamento/musicxml.py \
            scripts/build_release.py \
            tests/test_musicxml_external_doctype.py
      - name: Commit formatter output if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/temperamento/cli.py src/temperamento/project.py src/temperamento/musicxml.py scripts/build_release.py tests/test_musicxml_external_doctype.py
          git commit -m "Apply Ruff formatting to CI repair"
          git push origin HEAD:agent/fix-ci-audit
