name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[test]"
      - run: python -m coverage run --branch -m pytest
      - run: python -m coverage report --fail-under=95
      - run: python -m temperamento.cli --version
      - run: python -m temperamento.cli validate examples/arithmetic/add/add.musicxml
      - run: python -m temperamento.cli inspect examples/arithmetic/add/add.musicxml --execute
      - run: python -m temperamento.cli run examples/showcase/hello-world-prelude/hello-world-prelude.musicxml --output text

  quality-package-and-reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Install media toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: make reproducibility
